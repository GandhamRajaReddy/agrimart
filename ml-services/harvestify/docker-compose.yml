services:
  harvestify:
    build: .
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ./models:/srv/harvestify/models:ro
    environment:
      HARVESTIFY_MODEL_DIR: /srv/harvestify/models
      HARVESTIFY_DATA_DIR: /srv/harvestify/data
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health/ready',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
