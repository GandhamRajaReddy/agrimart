name: Backend CI

on:
  pull_request:
    paths:
      - "backend/django/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - feature/secure-role-auth
    paths:
      - "backend/django/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  accounts:
    name: Django checks and account tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agrimart
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agrimart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend/django
    env:
      DJANGO_ENV: development
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ci-only-key-that-is-long-enough-for-hmac-sha256-signing-0123456789
      DJANGO_DEBUG: "True"
      DATABASE_NAME: agrimart
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/development.txt
      - name: Django system check
        run: python manage.py check
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run account security tests
        run: python manage.py test apps.accounts
